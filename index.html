<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>北屯冰場 課程/裝備</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="app-build" content="2026-09-09d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%B8%EF%B8%8F%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#eef2f4; --surface:#ffffff; --surface-2:#f4f7f9; --raised:#ffffff;
  --ink:#122430; --ink-2:#38505d; --muted:#5f7683; --faint:#89a0ac;
  --line:#dbe4e8; --line-2:#e8eef1;
  --accent:#0d7aa6; --accent-ink:#ffffff; --accent-soft:#dff0f6;
  --ok:#1c7d4d; --ok-soft:#e0f0e7;
  --warn:#a9741a; --warn-soft:#f6ecd9;
  --bad:#bb3f3f; --bad-soft:#f6e2e2;
  --shadow:0 1px 2px rgba(18,36,48,.06),0 6px 20px rgba(18,36,48,.06);
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c141b; --surface:#141e27; --surface-2:#101922; --raised:#19242f;
    --ink:#e6eef2; --ink-2:#c0ccd5; --muted:#8fa1ac; --faint:#6a7c88;
    --line:#243139; --line-2:#1e2932;
    --accent:#3fb0d8; --accent-ink:#04222f; --accent-soft:#103240;
    --ok:#4bbd85; --ok-soft:#123024;
    --warn:#d6a24a; --warn-soft:#332a17;
    --bad:#e07a7a; --bad-soft:#3a2020;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#0c141b; --surface:#141e27; --surface-2:#101922; --raised:#19242f;
  --ink:#e6eef2; --ink-2:#c0ccd5; --muted:#8fa1ac; --faint:#6a7c88;
  --line:#243139; --line-2:#1e2932;
  --accent:#3fb0d8; --accent-ink:#04222f; --accent-soft:#103240;
  --ok:#4bbd85; --ok-soft:#123024;
  --warn:#d6a24a; --warn-soft:#332a17;
  --bad:#e07a7a; --bad-soft:#3a2020;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Barlow Semi Condensed","IBM Plex Sans","Microsoft JhengHei",sans-serif;margin:0;text-wrap:balance;font-weight:600;letter-spacing:.01em}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink)}
a{color:var(--accent)}

.wrap{display:flex;min-height:100vh;align-items:stretch}
.side{width:200px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:16px 16px 12px;display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--line-2)}
.brand .puck{width:27px;height:27px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:"Barlow Semi Condensed";font-size:15px}
.brand b{font-family:"Barlow Semi Condensed";font-weight:700;font-size:15.5px;letter-spacing:.02em;line-height:1.15}
.brand span{display:block;font-size:10px;color:var(--faint);letter-spacing:.04em}
.nav{padding:8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--ink-2);padding:8px 10px;border-radius:8px;font-weight:500}
.nav button .ic{width:16px;text-align:center;opacity:.75}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .sep{height:1px;background:var(--line-2);margin:6px 8px}
.nav .lock{margin-left:auto;font-size:11px;opacity:.5}
.side .foot{padding:10px;border-top:1px solid var(--line-2);display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.side .foot .role{font-size:11.5px;color:var(--muted);display:flex;gap:5px;align-items:center}
.side .foot button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 8px;font-size:12px}
.side .foot button:hover{color:var(--ink);border-color:var(--muted)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.topbar h2{font-size:19px}
.topbar .grow{flex:1}
.mpick{display:flex;gap:6px;align-items:center}
.mpick label{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.mpick .mo{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.mpick .mo button{background:none;border:0;padding:6px 10px;color:var(--muted);font-weight:700}
.mpick .mo button:hover{color:var(--ink);background:var(--surface-2)}
.mpick .mo .lbl{padding:6px 10px;font-family:"IBM Plex Mono";font-weight:600;border-left:1px solid var(--line);border-right:1px solid var(--line);min-width:96px;text-align:center}
select.pick,input.txt,textarea.txt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
select.pick:focus,input.txt:focus,textarea.txt:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.content{padding:22px;max-width:1200px;width:100%}

.btn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:8px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none}
.btn.sm{padding:5px 9px;font-size:12.5px;font-weight:500;border-radius:7px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger:hover{background:var(--bad-soft)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.card .k{font-size:11px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;font-weight:600;margin-bottom:5px}
.card .v{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;letter-spacing:-.01em}
.card .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.card.accent{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:linear-gradient(180deg,var(--accent-soft),var(--surface) 60%)}
.card .v.pos{color:var(--ok)} .card .v.neg{color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.panel > .ph{display:flex;gap:10px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel > .ph h3{font-size:15px;letter-spacing:.02em}
.panel > .ph .grow{flex:1}
.panel .pb{padding:14px 15px}
.panel .pb.flush{padding:0}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
.tfoot td{font-weight:600;background:var(--surface-2);border-top:2px solid var(--line)}
tbody tr.selrow{background:var(--accent-soft)}
tbody tr.selrow:hover{background:var(--accent-soft)}
tbody tr.daterow td{background:var(--surface-2)}
tbody tr.detrow td{border-bottom:1px solid var(--line-2)}
tbody tr.detrow td:nth-child(3){padding-left:18px}

.chip{display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.6;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.mut{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:8px}
.hint{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.warnp{color:var(--warn)} .badp{color:var(--bad)} .okp{color:var(--ok)}
.right{text-align:right}
.nowrap{white-space:nowrap}
.diffbad{color:var(--bad);font-weight:600}

/* attendance grid */
.gridwrap{overflow:auto;max-height:70vh;border-top:1px solid var(--line-2)}
table.grid{border-collapse:separate;border-spacing:0}
table.grid th,table.grid td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2)}
table.grid thead th{position:sticky;top:0;z-index:3;background:var(--surface-2)}
table.grid .stick{position:sticky;left:0;z-index:2;background:var(--surface);border-right:2px solid var(--line);min-width:120px;font-weight:600}
table.grid thead .stick{z-index:4}
table.grid tbody tr:hover .stick{background:var(--surface-2)}
table.grid td.cell{padding:4px;min-width:96px;cursor:pointer;vertical-align:top}
table.grid td.cell:hover{background:var(--accent-soft)}
table.grid td.cell.has{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.centry{display:block;font-size:11px;font-weight:600;color:var(--ink-2);padding:2px 4px;border-radius:5px;background:var(--surface);border:1px solid var(--line-2);margin:1px 0}
.dh{font-size:10.5px;line-height:1.25}
.dh b{font-family:"IBM Plex Mono";font-size:12px}
.dh .wd{color:var(--faint);font-weight:600}
.wk-sat,.wk-sun{color:var(--bad)}
.dchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.dchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;color:var(--ink-2);position:relative;min-width:46px}
.dchip .d{font-family:"IBM Plex Mono";font-weight:700;font-size:15px}
.dchip .w{font-size:10px;color:var(--faint)}
.dchip .n{position:absolute;top:-6px;right:-6px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 3px}
.dchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
table.dayatt{table-layout:fixed}
table.dayatt th:first-child,table.dayatt td:first-child{width:34%}
td.dcell{cursor:pointer;text-align:center;font-weight:600;color:var(--ink-2)}
td.dcell:hover{background:var(--accent-soft)}
td.dcell.has{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:560px}
.modal.wide{max-width:860px}
.modal .mh{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.modal .mh h3{font-size:16px;flex:1}
.modal .mh .x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.modal .mh .x:hover{background:var(--surface-2);color:var(--ink)}
.modal .mb{padding:18px}
.modal .mf{padding:13px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input.txt,.field select.pick,.field textarea.txt{width:100%}
.field .fh{font-size:11px;color:var(--faint);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.checkrow{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;margin-bottom:6px}
.checkrow input[type=checkbox]{width:16px;height:16px}
.checkrow .grow{flex:1}
.rowline{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.alloc{display:grid;grid-template-columns:1.3fr .9fr 1fr auto;gap:7px;align-items:center;margin-bottom:7px}
@media(max-width:640px){.alloc{grid-template-columns:1fr 1fr;}.rowline{grid-template-columns:1fr 1fr}}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease}
.toast.bad{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 11px;color:var(--muted);font-weight:600;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:0;font-size:inherit;text-decoration:underline;text-underline-offset:2px}

.statusbar{font-size:11.5px;color:var(--faint);padding:4px 22px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.statusbar .live{display:inline-flex;gap:5px;align-items:center}
.statusbar .live .d{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.statusbar .live.on .d{background:var(--ok)}

@media (max-width:820px){
  .wrap{flex-direction:column}
  .side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
  .brand{border-bottom:0;border-right:1px solid var(--line-2)}
  .nav{flex-direction:row;flex-wrap:wrap;flex:1}
  .nav .sep{display:none}
  .nav button{width:auto}
  .nav .lock{display:none}
  .side .foot{border-top:0;border-left:1px solid var(--line-2)}
  .content{padding:16px}
  .topbar{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>

<div class="wrap">
  <aside class="side">
    <div class="brand">
      <div class="puck">屯</div>
      <div><b>北屯冰場</b><span>課程 / 裝備</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <span class="role" id="roleTag">—</span>
      <button id="themeBtn" title="切換深/淺色">◐</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="statusbar" id="statusbar"></div>
    <div class="content" id="app"></div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";

/* ===================================================== Supabase 資料層（取代 Claude db） */
let SB=null;
const KV_TABLE="bt_kv";
const kvSubs={};   // key -> [ next 回呼 ]
function mkSnap(v){ return { exists: v!=null, data:()=> (v==null? undefined : v) }; }
const DBShim={
  doc(path){
    return {
      onSnapshot(next,err){
        (kvSubs[path]=kvSubs[path]||[]).push(next);
        SB.from(KV_TABLE).select("value").eq("k",path).maybeSingle()
          .then(({data,error})=>{ if(error){ err&&err(error); return; } next(mkSnap(data?data.value:null)); })
          .catch(e=>{ err&&err(e); });
        return ()=>{};
      },
      async set(obj){
        const { error } = await SB.from(KV_TABLE).upsert({ k:path, value:obj, updated_at:new Date().toISOString() },{ onConflict:"k" });
        if(error) throw error;
        (kvSubs[path]||[]).forEach(cb=>{ try{ cb(mkSnap(obj)); }catch(e){} });
      }
    };
  }
};
function startRealtime(){
  SB.channel("bt_kv_rt")
    .on("postgres_changes",{ event:"*", schema:"public", table:KV_TABLE },(payload)=>{
      const row=payload.new&&payload.new.k?payload.new:payload.old;
      if(!row||!row.k) return;
      const v = payload.eventType==="DELETE" ? null : (payload.new?payload.new.value:null);
      (kvSubs[row.k]||[]).forEach(cb=>{ try{ cb(mkSnap(v)); }catch(e){} });
    })
    .subscribe();
}

/* ===================================================== helpers */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TOL=30;
const WD=["日","一","二","三","四","五","六"];
const INV_YEARS=()=>{const y=new Date().getFullYear();return [y-1,y,y+1];};

function num(v){
  if(v==null) return 0;
  if(typeof v==="number") return isFinite(v)?v:0;
  let s=String(v).replace(/[,\s　]/g,"").replace(/NT\$?|＄|\$/gi,"").replace(/[（(]/,"-").replace(/[)）]/,"");
  const n=parseFloat(s); return isFinite(n)?n:0;
}
function fmt(n){ n=Math.round(num(n)); const s=Math.abs(n).toLocaleString("en-US"); return (n<0?"-NT$":"NT$")+s; }
function fmtP(n){ n=Math.round(num(n)); return n.toLocaleString("en-US"); }
function norm5(v){
  const s=String(v==null?"":v).replace(/\D/g,"").slice(-5);
  return (s.length>=1 && s.length<5) ? s.padStart(5,"0") : s;
}
function last5of(acct){ let s=String(acct||""); if(s.includes("/")) s=s.split("/").pop(); return norm5(s); }
function normPhone(v){
  let s=String(v==null?"":v).replace(/[\s\-().]/g,"");
  if(/^9\d{8}$/.test(s)) s="0"+s;            // 台灣手機少了開頭 0
  return /^[0-9+]{6,}$/.test(s) ? s : String(v||"").trim();
}
function normDate(v){
  const m=String(v||"").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}` : "";
}
function toast(msg,kind){
  const t=document.createElement("div"); t.className="toast"+(kind?" "+kind:""); t.textContent=msg;
  $("#toast").appendChild(t); setTimeout(()=>t.remove(),2600);
}
function today(){ return new Date().toISOString().slice(0,10); }
function curYM(){ return new Date().toISOString().slice(0,7); }
function ymLabel(ym){ const [y,m]=ym.split("-"); return `${y} 年 ${+m} 月`; }
function shiftYM(ym,delta){
  let [y,m]=ym.split("-").map(Number); m+=delta;
  while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
  return `${y}-${String(m).padStart(2,"0")}`;
}

/* ===================================================== computed */
function monthDates(ym){
  const [y,m]=ym.split("-").map(Number);
  const out=[]; const last=new Date(y,m,0).getDate();
  for(let d=1;d<=last;d++){
    const wd=new Date(y,m-1,d).getDay();
    if([1,2,3].includes(wd)) out.push(`${ym}-${String(d).padStart(2,"0")}`);
  }
  return out;
}
function activeDates(ym){
  const a=attM(ym);
  const arr=(a.dates&&a.dates.length)?a.dates.slice():monthDates(ym);
  return arr.sort();
}
/* 該日期所屬那一周的週一（YYYY-MM-DD，本地時間，不用 toISOString 以免時區偏移）*/
function weekMondayOf(dateStr){
  const [y,m,d]=dateStr.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  dt.setDate(dt.getDate()-((dt.getDay()+6)%7));
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
}
/* 該月的上課日依「周」分組 */
function monthWeeks(ym){
  const map={};
  activeDates(ym).forEach(dt=>{ const k=weekMondayOf(dt); (map[k]=map[k]||[]).push(dt); });
  return Object.keys(map).sort().map(monday=>({monday,dates:map[monday].slice().sort()}));
}
/* 某周的課程收入（依點名 × 價目表，原價）*/
function weekRevenue(ym,dates){
  const set=new Set(dates); let sum=0;
  Object.keys(attM(ym).cells).forEach(k=>{
    const dt=k.split("|")[1];
    if(!set.has(dt)) return;
    (attM(ym).cells[k]||[]).forEach(e=>{ sum+=priceOf(dt,e.slot); });
  });
  return sum;
}
function weekCostItems(ym,monday){ return (costM(ym).weeks[monday])||{}; }
function weekCostTotal(ym,monday){ const it=weekCostItems(ym,monday); return COST_WEEKLY.reduce((a,c)=>a+num(it[c[0]]&&it[c[0]].amount),0); }
function monthlyCostItems(ym){ return costM(ym).monthly||{}; }
function monthlyCostTotal(ym){ const it=monthlyCostItems(ym); return COST_MONTHLY.reduce((a,c)=>a+num(it[c[0]]&&it[c[0]].amount),0); }
/* 該月各成本類別的全月金額（ice 取月結、其餘各周加總）*/
function monthCatTotals(ym){
  const out={};
  COST_MONTHLY.forEach(c=>{ const it=monthlyCostItems(ym); out[c[0]]=num(it[c[0]]&&it[c[0]].amount); });
  COST_WEEKLY.forEach(c=>{ out[c[0]]=monthWeeks(ym).reduce((a,w)=>a+num((weekCostItems(ym,w.monday)[c[0]]||{}).amount),0); });
  return out;
}
function monthCostTotal(ym){ return monthlyCostTotal(ym)+monthWeeks(ym).reduce((a,w)=>a+weekCostTotal(ym,w.monday),0); }
function monthRevenue(ym){ return monthWeeks(ym).reduce((a,w)=>a+weekRevenue(ym,w.dates),0); }
function wdOf(dateStr){ const [y,m,d]=dateStr.split("-").map(Number); return new Date(y,m-1,d).getDay(); }
function sessionsFor(dateStr){ return S.settings.price[String(wdOf(dateStr))]||[]; }
function priceOf(dateStr,slot){ const ss=sessionsFor(dateStr); return ss[slot]?num(ss[slot].price):0; }
function cellKey(sid,date){ return sid+"|"+date; }
function cellEntries(ym,sid,date){ return (attM(ym).cells[cellKey(sid,date)])||[]; }
/* 場次顯示名稱：優先用價目表的「場次名稱」，若是通用的「第N場」且舊資料有班別就顯示班別 */
function entryLabel(dateStr,e){
  const ss=sessionsFor(dateStr);
  const nm=(ss[e.slot]&&ss[e.slot].label)||"";
  if(nm && !/^第[一二三四五六]?場$/.test(nm)) return nm;
  if(e.classId){ const c=(S.settings.classes||[]).find(x=>x.id===e.classId); if(c) return c.name; }
  return nm || ("第"+(e.slot+1)+"場");
}
const SLOTMARK=["①","②","③","④","⑤","⑥"];

function consecCfg(){ const c=S.settings.consecDiscount||{}; return {price:num(c.price)||1200, weeks:num(c.weeks)||4, amount:num(c.amount)||300}; }
/* 學員某月的「特別折扣」（個別學員手動給的），存在 student.adj[ym] = {amount, note} */
function studentAdj(ym,sid){
  const s=S.students.find(x=>x.id===sid);
  const a=s&&s.adj&&s.adj[ym];
  return (a && num(a.amount)>0) ? {amount:num(a.amount), note:a.note||""} : null;
}
/* 學員該月應收（由點名表算）。amount = 原價總額 − 連續報名折扣 − 特別折扣 */
function studentDue(ym,sid){
  const dates=activeDates(ym); let gross=0, sessions=0;
  dates.forEach(dt=>{
    cellEntries(ym,sid,dt).forEach(e=>{ gross+=priceOf(dt,e.slot); sessions++; });
  });
  // 連續報名折扣：單價 = cd.price 的場次，該學員在該星期連續 cd.weeks 周都有上該場次 → 折 cd.amount（每個符合的場次各折一次）
  const cd=consecCfg();
  const byWd={};
  dates.forEach(dt=>{ const w=wdOf(dt); (byWd[w]=byWd[w]||[]).push(dt); });
  const discounts=[];
  Object.keys(byWd).forEach(w=>{
    const dts=byWd[w].slice().sort();
    (S.settings.price[String(w)]||[]).forEach((sess,slot)=>{
      if(num(sess.price)!==cd.price) return;
      let run=0, best=0;
      dts.forEach(dt=>{
        if(cellEntries(ym,sid,dt).some(e=>e.slot===slot)){ run++; if(run>best) best=run; }
        else run=0;
      });
      if(best>=cd.weeks) discounts.push({label:(sess.label||("第"+(slot+1)+"場"))+" 連續"+cd.weeks+"周", amount:cd.amount});
    });
  });
  // 個別學員的特別折扣
  const adj=studentAdj(ym,sid);
  if(adj) discounts.push({label:adj.note||"特別折扣", amount:adj.amount, special:true});
  const discount=discounts.reduce((a,d)=>a+d.amount,0);
  return {gross, discount, discounts, amount:gross-discount, sessions};
}
/* 學員該月已收 / 已核對（由收款登錄的分配算，跨年度找）*/
function studentPaid(ym,sid){
  let logged=0, bank=0;
  allPays().forEach(p=>{
    (p.allocs||[]).forEach(a=>{
      if(a.sid===sid && a.ym===ym){
        const amt=num(a.amount);
        logged+=amt;
        if(!p.cash && (p.matchTxnId||p.bankPaid)) bank+=amt;
      }
    });
  });
  return {logged,bank};
}
function monthRoster(ym){
  // 學員：本月點名表出現過的 + 名冊 active
  const ids=new Set();
  Object.keys(attM(ym).cells).forEach(k=>{ if((attM(ym).cells[k]||[]).length) ids.add(k.split("|")[0]); });
  S.students.forEach(s=>{ if(s.active!==false) ids.add(s.id); });
  return S.students.filter(s=>ids.has(s.id)).sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant"));
}

/* 庫存結存（北屯）：調入 - 銷售 */
function stock(){
  const map={};
  S.invItems.forEach(i=>map[i.id]={item:i,in:0,sold:0,salesAmt:0});
  allMoves().forEach(m=>{
    if(!map[m.itemId]) return;
    if(m.type==="in"||m.type==="transfer") map[m.itemId].in+=num(m.qty);
    else if(m.type==="sale"){ map[m.itemId].sold+=num(m.qty); map[m.itemId].salesAmt+=num(m.price)*num(m.qty); }
  });
  Object.values(map).forEach(r=>r.left=r.in-r.sold);
  return map;
}

/* 應收帳款對帳 for year — 課程收款(kind=pay) 與 裝備銷售(kind=sale) 分開計算 */
function reconcile(year){
  const txns=bankY(year);
  const deposits=txns.filter(t=>num(t.deposit)>0 && !t.ignored);
  const recs=[];
  payY(year).forEach(p=>{ if(!p.cash) recs.push({
    kind:"pay", id:p.id, ref:p, date:p.date, last5:norm5(p.last5), amount:num(p.amount),
    label:(p.payer||studentNames(p))+" · 課程費", matched:!!p.matchTxnId, matchTxnId:p.matchTxnId||null }); });
  moveY(year).forEach(m=>{ if(m.type==="sale" && !m.cash) recs.push({
    kind:"sale", id:m.id, ref:m, date:m.date, last5:norm5(m.last5), amount:num(m.price)*num(m.qty),
    label:(m.buyer||"")+" · "+itemName(m.itemId)+" ×"+num(m.qty), matched:!!m.matchTxnId, matchTxnId:m.matchTxnId||null }); });

  const byTxn={};
  recs.forEach(r=>{ if(r.matchTxnId){ (byTxn[r.matchTxnId]=byTxn[r.matchTxnId]||[]).push(r); } });
  const openByL5={pay:{},sale:{}};
  const allL5={pay:new Set(),sale:new Set()};
  recs.forEach(r=>{
    if(r.last5) allL5[r.kind].add(r.last5);
    if(!r.matched){ const k=r.last5||"—"; (openByL5[r.kind][k]=openByL5[r.kind][k]||[]).push(r); }
  });
  const stuByL5={};
  S.students.forEach(s=>{ const k=norm5(s.last5); if(k) (stuByL5[k]=stuByL5[k]||[]).push(s); });

  function sideOf(t,side){
    const dep=num(t.deposit);
    const all=byTxn[t.id]||[];
    const mine=all.filter(r=>r.kind===side);
    const other=all.filter(r=>r.kind!==side);
    const mineSum=mine.reduce((s,r)=>s+r.amount,0);
    const otherSum=other.reduce((s,r)=>s+r.amount,0);
    const target=dep-otherSum;   // 這一類要湊到的金額（扣掉另一類已對的）
    const stuCands = side==="pay" ? (stuByL5[t.last5]||[]) : [];
    let status,cands=[];
    if(mine.length){
      status=Math.abs(mineSum-target)<=TOL?"matched":"matched-diff";
    }else{
      const grp=openByL5[side][t.last5]||[];
      if(!grp.length){
        status = allL5[side].has(t.last5) ? "settled-l5"
               : stuCands.length ? "student-l5" : "orphan";
      }else{
        const g=grp.reduce((s,r)=>s+r.amount,0);
        status=Math.abs(g-target)<=TOL?"auto-ready":"mismatch";
        cands=grp;
      }
    }
    const rel = mine.length>0 || (openByL5[side][t.last5]||[]).length>0 || stuCands.length>0;
    return {mine,mineSum,other,otherSum,target,dep,status,cands,stuCands,rel,diff:mineSum-target};
  }

  const txnInfo=deposits.map(t=>{
    const all=byTxn[t.id]||[];
    const pay=sideOf(t,"pay"), sale=sideOf(t,"sale");
    const fullyOrphan = all.length===0
      && !(openByL5.pay[t.last5]||[]).length && !(openByL5.sale[t.last5]||[]).length
      && !(stuByL5[t.last5]||[]).length;
    return {txn:t,dep:num(t.deposit),all,pay,sale,fullyOrphan,
      payRel: pay.rel || fullyOrphan, saleRel: sale.rel || fullyOrphan};
  });

  const recInfo=recs.map(r=>{
    let st="open";
    if(r.matchTxnId){
      const ti=txnInfo.find(x=>x.txn.id===r.matchTxnId);
      const side=ti?ti[r.kind]:null;
      st = side && side.status==="matched-diff" ? "paid-diff" : "paid";
    } else if(r.ref.bankPaid) st="paid";
    return {rec:r,st};
  });

  const ksum=(k,f)=>recs.filter(r=>r.kind===k).reduce((s,r)=>s+f(r),0);
  const paidSet=new Set(recInfo.filter(x=>x.st==="paid"||x.st==="paid-diff").map(x=>x.rec.id));
  const stat=k=>{
    const total=ksum(k,r=>r.amount);
    const paid=recs.filter(r=>r.kind===k&&paidSet.has(r.id)).reduce((s,r)=>s+r.amount,0);
    const tis=txnInfo.filter(x=>x[k+"Rel"]);
    const stf=x=>x[k].status;
    return {
      recvTotal:total, recvPaid:paid, recvOpen:total-paid,
      nOpen:recInfo.filter(x=>x.st==="open"&&x.rec.kind===k).length,
      nAuto:tis.filter(x=>stf(x)==="auto-ready").length,
      nMismatch:tis.filter(x=>stf(x)==="mismatch"||stf(x)==="matched-diff").length,
      nOrphan:tis.filter(x=>stf(x)==="orphan").length,
      nStudentL5:tis.filter(x=>stf(x)==="student-l5").length
    };
  };

  return {
    txns,deposits,txnInfo,recs,recInfo,
    course:stat("pay"), inv:stat("sale")
  };
}
function studentNames(p){ return [...new Set((p.allocs||[]).map(a=>studentName(a.sid)))].join("、"); }

async function runAutoMatch(year,side){
  const R=reconcile(year);
  const used=new Set(); let n=0;
  R.txnInfo.forEach(ti=>{
    const sd=ti[side];
    if(sd.status==="auto-ready" && sd.cands.every(r=>!used.has(r.id))){
      sd.cands.forEach(r=>{
        r.ref.matchTxnId=ti.txn.id;
        r.ref.matchDate=ti.txn.txnDate||ti.txn.postDate||today();
        r.ref.bankPaid=true;
        used.add(r.id); n++;
      });
    }
  });
  if(n){
    if(side==="pay") await pushPays(year); else await pushMoves(year);
    toast(`自動對帳完成：勾稽 ${n} 筆`,"ok");
  } else toast("沒有可自動對帳的入帳（金額湊不出來，請手動指派）");
}

  const m=String(bd||"").match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return "";

  if(t.getMonth()+1 < +m[2] || (t.getMonth()+1===+m[2] && t.getDate()<+m[3])) a--;

/* 依點名把某學員某月的場次拆成 { label -> {count,amount} } */
function studentDueBreakdown(ym,sid){
  const dates=activeDates(ym);
  const byLabel={};
  let amount=0, sessions=0;
  dates.forEach(dt=>{
    cellEntries(ym,sid,dt).forEach(e=>{
      const lbl=entryLabel(dt,e), p=priceOf(dt,e.slot);
      const b=(byLabel[lbl]=byLabel[lbl]||{count:0,amount:0});
      b.count++; b.amount+=p; amount+=p; sessions++;
    });
  });
  return {byLabel,amount,sessions};
}
function enrolledStudents(ym,roster){

  return roster.filter(s=>ds.some(dt=>cellEntries(ym,s.id,dt).length));
}

      · ${roster.length} 位在學學員　—　切換上方「月份」看其他月；學員報名後直接在下方勾選他上的場次即可
    </div>`;

  if(!dates.length){
    return `<div class="panel">${head}<div class="empty">本月沒有上課日。<button class="btn sm" data-act="edit-dates">產生上課日</button></div></div>`;
  }

  if(view==="grid"){
    const th=dates.map(dt=>{
      const wd=wdOf(dt); const dd=+dt.slice(-2);
      return `<th class="dh"><div class="wd wk-${['sun','','','','','','sat'][wd]||''}">週${WD[wd]}</div><b>${dd}</b></th>`;
    }).join("");
    const body=roster.map(s=>{
      const cells=dates.map(dt=>{
        const ents=cellEntries(ym,s.id,dt);
        const inner=ents.slice().sort((a,b)=>a.slot-b.slot).map(e=>`<span class="centry">${SLOTMARK[e.slot]||''} ${esc(entryLabel(dt,e))}</span>`).join("");
        return `<td class="cell ${ents.length?'has':''}" data-cell="${s.id}|${dt}">${inner||'<span class="hint">＋</span>'}</td>`;
      }).join("");
      const d=studentDue(ym,s.id);
      return `<tr><td class="stick" data-open-student="${s.id}" style="cursor:pointer">${esc(s.name)}
        <div class="hint num">${fmt(d.amount)} · ${d.sessions}堂${d.discount?` <span class="okp">折-${fmtP(d.discount)}</span>`:""}</div></td>${cells}</tr>`;
    }).join("");
    return `<div class="panel">${head}
      <div class="gridwrap"><table class="grid">
        <thead><tr><th class="stick">學員 \\ 日期</th>${th}</tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </div>
    ${attDuePanel(ym,roster)}
    <p class="hint">點格子勾選該學員當天上了哪些場次。想單日點名比較簡潔，切到「單日」。</p>`;
  }

  /* ---- 單日 ---- */
  let dt=S.ui.attDate;
  if(!dates.includes(dt)){
    const t=today();
    dt = dates.find(x=>x>=t) || dates[dates.length-1];
    S.ui.attDate=dt;
  }
  const wd=wdOf(dt);
  const ss=sessionsFor(dt);
  const chips=dates.map(x=>{
    const n=roster.reduce((a,s)=>a+cellEntries(ym,s.id,x).length,0);
    return `<button class="dchip ${x===dt?'on':''}" data-attdate="${x}">
      <span class="d">${+x.slice(-2)}</span><span class="w">週${WD[wdOf(x)]}</span>${n?`<span class="n">${n}</span>`:""}</button>`;
  }).join("");

  const rows=roster.map(s=>{
    const ents=cellEntries(ym,s.id,dt);
    const cellFor=slot=>{
      const e=ents.find(x=>x.slot===slot);
      return `<td class="dcell ${e?'has':''}" data-cell="${s.id}|${dt}" data-focus="${slot}">${e?'✓ 有來':'<span class="hint">＋</span>'}</td>`;
    };
    const dd=studentDue(ym,s.id);
    return `<tr>
      <td data-cell="${s.id}|${dt}"><b>${esc(s.name)}</b>
        <div class="hint num">本月 ${fmt(dd.amount)} · ${dd.sessions}堂${dd.discount?` <span class="okp">折-${fmtP(dd.discount)}</span>`:""}</div></td>
      ${ss.map((_,i)=>cellFor(i)).join("")}
    </tr>`;
  }).join("");

  const perSess=ss.map((sess,i)=>{
    const n=roster.reduce((a,s)=>a+cellEntries(ym,s.id,dt).filter(e=>e.slot===i).length,0);
    return `<span class="chip mut">${esc(sess.label)} ${n} 人</span>`;
  }).join(" ");

  return `<div class="panel">${head}
    <div class="pb" style="padding-bottom:8px"><div class="dchips">${chips}</div></div>
    <div class="pb" style="padding-top:0"><b>${esc(dt)}（週${WD[wd]}）</b>　${perSess||'<span class="hint">這天沒有設定場次</span>'}</div>
    ${ss.length?`<div class="tw"><table class="dayatt">
      <thead><tr><th>學員</th>${ss.map(x=>`<th style="text-align:center">${esc(x.label)}<div class="hint">${esc(x.time||"")} · ${fmtP(x.price)}</div></th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`:`<div class="empty">週${WD[wd]}沒有場次／價格，請到「設定 → 價目表」新增。</div>`}
  </div>
  ${attDuePanel(ym,roster)}
  <p class="hint">點學員任一格開啟登錄。切「整月表」看跨日全貌。</p>`;
}

  const ents=cellEntries(ym,sid,date);
  const s=scrim(`
   <div class="mh"><h3>${esc(studentName(sid))} · ${esc(date)}（週${WD[wd]}）</h3><button class="x" data-x>×</button></div>
   <div class="mb">
     <p class="hint">勾選這位學員這天上了哪些場次</p>
     ${ss.map((sess,i)=>{
       const on=ents.some(x=>x.slot===i);
       return `<label class="checkrow"><input type="checkbox" data-slot="${i}" ${on?"checked":""}>
         <span class="grow"><b>${esc(sess.label||("第"+(i+1)+"場"))}</b> <span class="hint">${esc(sess.time||"")} · ${fmtP(sess.price)}</span></span></label>`;
     }).join("")}
   </div>
   <div class="mf"><button class="btn danger ghost" id="c-clear">清空此格</button>
     <button class="btn ghost" data-x>取消</button><button class="btn primary" id="c-save">儲存</button></div>`);
  $("#c-clear",s).onclick=()=>{ delete attM(ym).cells[cellKey(sid,date)]; closeScrim(s); pushAttend(ym); toast("已清空"); };

    const arr=[];
    $$("[data-slot]",s).forEach(el=>{ if(el.checked){ const slot=+el.dataset.slot; const old=ents.find(x=>x.slot===slot); arr.push(old?Object.assign({},old,{slot}):{slot}); } });

function payModal(id){
  const yNow=new Date().getFullYear();
  let p=id?allPays().find(x=>x.id===id):null;
  const editing=!!p;
  if(!p) p={id:uid(),date:today(),amount:0,last5:"",cash:false,payer:"",note:"",allocs:[{sid:"",ym:S.ui.ym,amount:0,kind:"course",note:""}]};
  else p=clone(p);
  if(!p.allocs||!p.allocs.length) p.allocs=[{sid:"",ym:S.ui.ym,amount:0,kind:"course",note:""}];

  const allocRow=(a,i)=>`
    <div class="alloc" data-arow="${i}">
      <select class="pick" data-af="sid">
        <option value="">— 學員 —</option>
        ${S.students.slice().sort((x,y)=>x.name.localeCompare(y.name,"zh-Hant")).map(s=>`<option value="${s.id}" ${a.sid===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}
      </select>
      <input class="txt" data-af="ym" value="${esc(a.ym||S.ui.ym)}" placeholder="YYYY-MM" style="font-family:'IBM Plex Mono'">
      <input class="txt num" data-af="amount" type="number" value="${a.amount||""}" placeholder="金額">
      <div style="display:flex;gap:4px;align-items:center">
        <select class="pick" data-af="kind" style="width:auto"><option value="course" ${a.kind!=="makeup"?"selected":""}>月費</option><option value="makeup" ${a.kind==="makeup"?"selected":""}>補堂</option></select>
        <button class="btn sm danger ghost" data-arm="${i}">×</button>
      </div>
    </div>`;

  const s=scrim(`
   <div class="mh"><h3>${editing?"編輯收款":"新增收款"}</h3><button class="x" data-x>×</button></div>
   <div class="mb">
     <div class="grid2">
       <div class="field"><label>收款日期</label><input class="txt" id="p-date" type="date" value="${esc(p.date||today())}"></div>
       <div class="field"><label>總金額</label><input class="txt num" id="p-amount" type="number" value="${p.amount||""}"></div>
     </div>
     <div class="grid2">
       <div class="field"><label>繳款人 / 家長</label><input class="txt" id="p-payer" value="${esc(p.payer||"")}" placeholder="例：王媽媽"></div>
       <div class="field"><label>匯款帳號後五碼</label><input class="txt" id="p-last5" value="${esc(p.last5||"")}" placeholder="12345" ${p.cash?"disabled":""}></div>
     </div>
     <div class="field"><label class="checkrow" style="margin:0"><input type="checkbox" id="p-cash" ${p.cash?"checked":""}> 現金繳款（不進銀行對帳）</label></div>
     <div class="field"><label>分配到學員 / 月份 <span class="hint">一筆匯款可分給多位學員、多個月</span></label>
       <div id="p-allocs">${p.allocs.map(allocRow).join("")}</div>
       <button class="btn sm" id="p-addalloc">＋ 再加一筆分配</button>
       <div class="fh" id="p-sum"></div>
     </div>
     <div class="field"><label>備註</label><input class="txt" id="p-note" value="${esc(p.note||"")}"></div>
   </div>
   <div class="mf"><button class="btn ghost" data-x>取消</button><button class="btn primary" id="p-save">儲存</button></div>`,"wide");

  function refreshSum(){
    const tot=num($("#p-amount",s).value);
    const asum=$$("[data-af='amount']",s).reduce((a,el)=>a+num(el.value),0);
    const el=$("#p-sum",s);
    el.textContent=`分配合計 ${fmtP(asum)} ／ 總金額 ${fmtP(tot)}${Math.abs(asum-tot)>1?"　⚠ 不一致":"　✓"}`;
    el.style.color=Math.abs(asum-tot)>1?"var(--bad)":"var(--ok)";
  }
  function autofillAlloc(rowEl){
    const sid=$("[data-af='sid']",rowEl).value, ym=$("[data-af='ym']",rowEl).value;
    const amtEl=$("[data-af='amount']",rowEl);
    if(sid && /^\d{4}-\d{2}$/.test(ym) && !num(amtEl.value)){
      const d=studentDue(ym,sid), paid=studentPaid(ym,sid).logged;
      const remain=d.amount-paid;
      if(remain>0){ amtEl.value=remain; refreshSum(); }
    }
    const stu=S.students.find(x=>x.id===sid);
    const l5El=$("#p-last5",s);
    if(stu && stu.last5 && !$("#p-cash",s).checked && !l5El.value.trim()) l5El.value=stu.last5;
  }
  s.addEventListener("input",e=>{
    if(e.target.id==="p-amount"||e.target.dataset.af==="amount") refreshSum();
  });
  s.addEventListener("change",e=>{
    if(e.target.dataset.af==="sid"||e.target.dataset.af==="ym") autofillAlloc(e.target.closest("[data-arow]"));
    if(e.target.id==="p-cash"){ $("#p-last5",s).disabled=e.target.checked; }
  });
  s.addEventListener("click",e=>{
    const rm=e.target.closest("[data-arm]");
    if(rm){ const rows=$$("#p-allocs .alloc",s); if(rows.length>1) rows[+rm.dataset.arm].remove(); refreshSum(); return; }
  });
  $("#p-addalloc",s).onclick=()=>{
    const i=$$("#p-allocs .alloc",s).length;
    $("#p-allocs",s).insertAdjacentHTML("beforeend",allocRow({sid:"",ym:S.ui.ym,amount:0,kind:"course"},i));
  };
  refreshSum();

  $("#p-save",s).onclick=()=>{
   try{
    const cash=$("#p-cash",s).checked;
    const rec={
      id:p.id, date:$("#p-date",s).value||today(), amount:num($("#p-amount",s).value),
      payer:$("#p-payer",s).value.trim(), last5: cash?"":norm5($("#p-last5",s).value),
      cash, note:$("#p-note",s).value.trim(),
      allocs:$$("#p-allocs .alloc",s).map(r=>({
        sid:$("[data-af='sid']",r).value, ym:$("[data-af='ym']",r).value.trim(),
        amount:num($("[data-af='amount']",r).value), kind:$("[data-af='kind']",r).value,
      })).filter(a=>a.sid&&a.ym),
      matchTxnId:p.matchTxnId||null, matchDate:p.matchDate||null, bankPaid:p.bankPaid||false
    };
    if(!rec.allocs.length){ toast("請至少指定一位學員與月份","bad"); return; }
    // 移除舊紀錄（可能換年度）
    Object.keys(S.pays).forEach(y=>{ S.pays[y]=S.pays[y].filter(x=>x.id!==rec.id); });
    const y=(rec.date||today()).slice(0,4);
    payY(y).push(rec);
    closeScrim(s);
    INV_YEARS().concat([+y]).forEach(yy=>{ if(S.pays[yy]) pushPays(yy); });
    pushPays(y);
    toast("已儲存收款","ok");
   }catch(err){ toast("儲存失敗："+(err&&err.message||err),"bad"); console.error(err); }
  };
}

function viewDues(){
  const ym=S.ui.ym;
  const roster=monthRoster(ym);
  let tDue=0,tLog=0,tBank=0,tSess=0;
  const rows=roster.map(s=>{
    const d=studentDue(ym,s.id), p=studentPaid(ym,s.id);
    tDue+=d.amount; tLog+=p.logged; tBank+=p.bank; tSess+=d.sessions;
    const owe=d.amount-p.logged, unver=p.logged-p.bank;
    let chip;
    if(d.amount===0 && p.logged===0) chip=`<span class="chip mut">—</span>`;
    else if(owe>TOL) chip=`<span class="chip bad"><span class="dot"></span>欠 ${fmtP(owe)}</span>`;
    else if(unver>TOL) chip=`<span class="chip warn"><span class="dot"></span>待銀行核對</span>`;
    else chip=`<span class="chip ok"><span class="dot"></span>已收齊</span>`;
    const aj=studentAdj(ym,s.id);
    return `<tr data-open-student="${s.id}" style="cursor:pointer">
      <td><b>${esc(s.name)}</b>${aj?`<div class="hint okp">特別折扣 -${fmtP(aj.amount)}${aj.note?"（"+esc(aj.note)+"）":""}</div>`:""}</td>
      <td class="num">${d.sessions}</td>
      <td class="num">${fmt(d.amount)}${d.discount?`<div class="hint okp">原 ${fmtP(d.gross)}・折 -${fmtP(d.discount)}</div>`:""}</td>
      <td class="num">${fmt(p.logged)}</td>
      <td class="num">${fmt(p.bank)}</td>
      <td class="num ${owe>TOL?'badp':''}">${fmt(owe)}</td>
      <td>${chip}</td></tr>`;
  }).join("");
  return `
  <div class="cards">
    <div class="card"><div class="k">應收合計</div><div class="v">${fmt(tDue)}</div></div>
    <div class="card"><div class="k">已收（業務登錄）</div><div class="v">${fmt(tLog)}</div><div class="sub">缺 ${fmt(tDue-tLog)}</div></div>
    <div class="card"><div class="k">銀行已核對</div><div class="v">${fmt(tBank)}</div><div class="sub">已登未核 ${fmt(tLog-tBank)}</div></div>
    <div class="card accent"><div class="k">未收</div><div class="v ${tDue-tLog>TOL?'neg':'pos'}">${fmt(tDue-tLog)}</div></div>
  </div>
  <div class="panel">
    <div class="ph"><h3>${esc(ymLabel(ym))}　每位學員 應收 → 已收 → 核對</h3><div class="grow"></div>
      <button class="btn sm" data-act="export-dues">⬇ 匯出 CSV</button></div>
    <div class="pb flush"><div class="tw"><table>
      <thead><tr><th>學員</th><th class="num">堂數</th><th class="num">應收</th><th class="num">已收</th><th class="num">銀行核對</th><th class="num">未收</th><th>狀態</th></tr></thead>
      <tbody>${rows||`<tr><td colspan="7" class="empty">本月沒有資料</td></tr>`}</tbody>
      <tfoot class="tfoot"><tr><td>合計（${roster.length} 位）</td><td class="num">${tSess}</td><td class="num">${fmt(tDue)}</td><td class="num">${fmt(tLog)}</td><td class="num">${fmt(tBank)}</td><td class="num">${fmt(tDue-tLog)}</td><td></td></tr></tfoot>
    </table></div></div>
  </div>
  <p class="hint">「已收」＝業務在收款登錄填的金額；「銀行核對」＝該筆匯款已在銀行對帳勾稽。點學員看繳費明細。</p>`;
}

/* 個別學員的「特別折扣」（某月），存 student.adj[ym] = {amount,note} */
function adjustModal(arg){
  const [ym,sid]=String(arg).split(":");
  const s=S.students.find(x=>x.id===sid); if(!s) return;
  const cur=(s.adj&&s.adj[ym])||{amount:"",note:""};
  const d=studentDue(ym,sid);
  const autoD=d.discounts.filter(x=>!x.special).reduce((a,x)=>a+x.amount,0);
  const m=scrim(`
   <div class="mh"><h3>${esc(s.name)} · ${esc(ymLabel(ym))} 特別折扣</h3><button class="x" data-x>×</button></div>
   <div class="mb">
     <p class="hint">個別給這位學員的折扣，只影響 ${esc(ymLabel(ym))}。<br>
       原價 ${fmt(d.gross)}${autoD?` ・ 連續報名折扣 -${fmtP(autoD)}`:""}。</p>
     <div class="grid2">
       <div class="field"><label>折扣金額</label><input class="txt num" id="aj-amt" type="number" value="${cur.amount||""}" placeholder="0"></div>
       <div class="field"><label>原因 / 備註</label><input class="txt" id="aj-note" value="${esc(cur.note||"")}" placeholder="例：教練子女、久候補償、推薦好友"></div>
     </div>
   </div>
   <div class="mf">${(s.adj&&s.adj[ym])?`<button class="btn danger ghost" id="aj-clear">清除折扣</button>`:""}
     <button class="btn ghost" data-x>取消</button><button class="btn primary" id="aj-save">儲存</button></div>`);
  const commit=(amt,note)=>{
    if(!s.adj) s.adj={};
    if(num(amt)>0) s.adj[ym]={amount:num(amt),note:(note||"").trim()};
    else delete s.adj[ym];
    closeScrim(m); pushStudents(); toast("已更新特別折扣","ok");
  };
  $("#aj-save",m).onclick=()=>commit($("#aj-amt",m).value,$("#aj-note",m).value);
  const cl=$("#aj-clear",m); if(cl) cl.onclick=()=>commit(0,"");
}

function assignModal(arg){
  const y=S.ui.bankYear;
  const [sidePart,idPart]=String(arg).includes(":")?arg.split(":"):[null,arg];
  const R=reconcile(y);
  const ti=R.txnInfo.find(x=>x.txn.id===idPart); if(!ti) return;
  const t=ti.txn;
  const side=sidePart||"pay";
  const otherNm=side==="pay"?"裝備":"課程";
  const sd=ti[side];
  // 只列出「這一類」還沒對帳、或已對到這筆的收款
  const open=R.recs.filter(r=>r.kind===side && (!r.matched || r.matchTxnId===t.id));
  const s=scrim(`
   <div class="mh"><h3>指派入帳 ${fmt(t.deposit)}（${esc(t.last5||"—")}）· ${side==="pay"?"課程":"裝備"}</h3><button class="x" data-x>×</button></div>
   <div class="mb">
     <p class="hint">${esc(t.txnDate||t.postDate||"")} · ${esc(t.summary||"")}${sd.otherSum?`　—　另有${otherNm}已對 ${fmtP(sd.otherSum)}`:""}</p>
     <div id="as-list">${open.map(r=>`
       <label class="checkrow"><input type="checkbox" data-r="${r.id}" ${r.matchTxnId===t.id?"checked":""}>
         <span class="grow">${esc(r.label)} <span class="hint">${r.date||""} · ${r.last5||"—"}</span></span>
         <b class="num">${fmtP(r.amount)}</b></label>`).join("")||`<p class="hint">沒有可指派的${side==="pay"?"課程收款":"裝備銷售"}。${side==="pay"?"若這是學員的課程匯款，關掉此視窗按「建收款」。":"請先到「裝備進銷存」登錄這筆匯款銷售。"}</p>`}</div>
     <div class="fh" id="as-sum"></div>
   </div>
   <div class="mf"><button class="btn ghost" data-x>取消</button><button class="btn primary" id="as-save">套用</button></div>`,"wide");
  function sum(){
    const sel=$$("#as-list input:checked",s).map(c=>c.dataset.r);
    let a=0; sel.forEach(id=>{ const r=open.find(x=>x.id===id); if(r) a+=r.amount; });
    const target=sd.target;
    const el=$("#as-sum",s);
    el.textContent=`勾選合計 ${fmtP(a)} ／ 需湊 ${fmtP(target)}${sd.otherSum?`（入帳 ${fmtP(t.deposit)} 扣掉另一類 ${fmtP(sd.otherSum)}）`:""}　${Math.abs(a-target)<=TOL?"✓":"⚠ 差 "+fmtP(a-target)}`;
    el.style.color=Math.abs(a-target)<=TOL?"var(--ok)":"var(--warn)";
  }
  s.addEventListener("change",sum); sum();
  $("#as-save",s).onclick=()=>{
   try{
    const sel=new Set($$("#as-list input:checked",s).map(c=>c.dataset.r));
    const date=t.txnDate||t.postDate||today();
    open.forEach(r=>{
      const on=sel.has(r.id);
      if(side==="pay"){
        const p=allPays().find(x=>x.id===r.id);
        if(p){ if(on){ p.matchTxnId=t.id; p.matchDate=date; p.bankPaid=true; } else if(p.matchTxnId===t.id){ p.matchTxnId=null; } }
      } else {
        const m=allMoves().find(x=>x.id===r.id);
        if(m){ if(on){ m.matchTxnId=t.id; m.bankPaid=true; } else if(m.matchTxnId===t.id){ m.matchTxnId=null; } }
      }
    });
    closeScrim(s);
    if(side==="pay") INV_YEARS().forEach(pushPays); else INV_YEARS().forEach(pushMoves);
    toast("已指派","ok");
   }catch(err){ toast("指派失敗："+(err&&err.message||err),"bad"); console.error(err); }
  };
}

    return `<div class="alloc" data-brow>
      <label class="grow" style="display:flex;gap:7px;align-items:center">
        <input type="checkbox" data-bf="on" ${checked?"checked":""}>
        <b>${esc(stu.name)}</b><span class="hint" data-bf="sid" data-sid="${sid}"></span>
      </label>
      <input class="txt" data-bf="ym" value="${esc(S.ui.ym)}" placeholder="YYYY-MM" style="font-family:'IBM Plex Mono';width:100px">
      <input class="txt num" data-bf="amount" type="number" placeholder="金額" style="width:96px">
      <button class="btn sm danger ghost" data-brm>×</button>
    </div>`;
  };
  const s=scrim(`
   <div class="mh"><h3>依後五碼建立課程收款 ${fmt(t.deposit)}（${esc(t.last5||"—")}）</h3><button class="x" data-x>×</button></div>
   <div class="mb">
     <p class="hint">${esc(date)} · ${esc(t.summary||"")}　—　後五碼對到：<b>${cand.map(x=>esc(x.name)).join("、")||"無"}</b></p>
     <div id="bp-list">${cand.map(c=>rowH(c.id,true)).join("")}</div>
     <div style="display:flex;gap:8px;align-items:center;margin:8px 0">
       <select class="pick" id="bp-add"><option value="">＋ 加入其他學員…</option>${others.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select>
     </div>
     <div class="fh" id="bp-sum"></div>
   </div>
   <div class="mf"><button class="btn ghost" data-x>取消</button><button class="btn primary" id="bp-save">建立並對帳</button></div>`,"wide");

  function fillAmt(row){
    const sid=$("[data-bf='sid']",row).dataset.sid;
    const ym=$("[data-bf='ym']",row).value.trim();
    const amtEl=$("[data-bf='amount']",row);
    if(/^\d{4}-\d{2}$/.test(ym) && !num(amtEl.value)){
      const remain=studentDue(ym,sid).amount - studentPaid(ym,sid).logged;
      if(remain>0) amtEl.value=remain;
    }
  }
  function sum(){
    let a=0;
    $$("#bp-list [data-brow]",s).forEach(r=>{ if($("[data-bf='on']",r).checked) a+=num($("[data-bf='amount']",r).value); });
    const el=$("#bp-sum",s);
    el.textContent=`合計 ${fmtP(a)} ／ 需湊 ${fmtP(target)}${ti.pay.otherSum?`（入帳 ${fmtP(t.deposit)} 扣裝備 ${fmtP(ti.pay.otherSum)}）`:""}　${Math.abs(a-target)<=TOL?"✓":"⚠ 差 "+fmtP(a-target)}`;
    el.style.color=Math.abs(a-target)<=TOL?"var(--ok)":"var(--warn)";
  }
  $$("#bp-list [data-brow]",s).forEach(fillAmt); sum();
  s.addEventListener("input",e=>{ if(e.target.dataset.bf==="amount"||e.target.dataset.bf==="ym") sum(); });
  s.addEventListener("change",e=>{
    if(e.target.dataset.bf==="on") sum();
    if(e.target.dataset.bf==="ym") fillAmt(e.target.closest("[data-brow]")), sum();
  });
  s.addEventListener("click",e=>{ const rm=e.target.closest("[data-brm]"); if(rm){ rm.closest("[data-brow]").remove(); sum(); }});
  $("#bp-add",s).onchange=e=>{
    const sid=e.target.value; if(!sid) return;
    $("#bp-list",s).insertAdjacentHTML("beforeend",rowH(sid,true));
    const row=$("#bp-list",s).lastElementChild; fillAmt(row); sum();
    e.target.value=""; e.target.querySelector(`option[value="${sid}"]`)?.remove();
  };
  $("#bp-save",s).onclick=()=>{
   try{
    const allocs=[];
    $$("#bp-list [data-brow]",s).forEach(r=>{
      if(!$("[data-bf='on']",r).checked) return;
      const sid=$("[data-bf='sid']",r).dataset.sid;
      const ym=$("[data-bf='ym']",r).value.trim();
      const amount=num($("[data-bf='amount']",r).value);
      if(sid && /^\d{4}-\d{2}$/.test(ym) && amount) allocs.push({sid,ym,amount,kind:"course"});
    });
    if(!allocs.length){ toast("請至少勾選一位學員並填月份/金額","bad"); return; }
    const yr=(date||today()).slice(0,4);
    const allocSum=allocs.reduce((a,x)=>a+x.amount,0);
    payY(yr).push({
      id:uid(), date, amount:allocSum, payer:cand.map(x=>x.name).join("、"),
      last5:norm5(t.last5), cash:false, note:ti.pay.otherSum?"由銀行對帳建立（此匯款另含裝備）":"由銀行對帳建立",
      allocs, matchTxnId:t.id, matchDate:date, bankPaid:true
    });
    closeScrim(s);
    INV_YEARS().concat([+yr]).forEach(yy=>{ if(S.pays[yy]) pushPays(yy); });
    pushPays(yr);
    toast("已建立收款並完成對帳","ok");
   }catch(err){ toast("失敗："+(err&&err.message||err),"bad"); console.error(err); }
  };
}

/* 手動核銷：不匯入銀行明細，直接標記某筆收款/銷售「銀行已到帳」*/
function markPaidModal(arg){
  const [kind,id]=String(arg).split(":");
  const rec = kind==="pay" ? allPays().find(x=>x.id===id) : allMoves().find(x=>x.id===id);
  if(!rec) return;
  const label = kind==="pay" ? (rec.payer||studentNames(rec)||"課程費") : ((rec.buyer?rec.buyer+" · ":"")+itemName(rec.itemId)+" ×"+num(rec.qty));
  const amt = kind==="pay" ? num(rec.amount) : num(rec.price)*num(rec.qty);
  const s=scrim(`
   <div class="mh"><h3>手動核銷 ${fmt(amt)}</h3><button class="x" data-x>×</button></div>
   <div class="mb">
     <p class="hint">${esc(label)}　·　後五碼 ${esc(rec.last5||"—")}</p>
     <div class="field"><label>銀行入帳日期</label><input class="txt" id="mp-date" type="date" value="${esc(rec.matchDate||today())}"></div>
     <p class="hint">確認你已在銀行查到這筆入帳。核銷後這筆在「應收對帳」會計入「銀行核對」，但不會有銀行明細列可對差額。</p>
   </div>
   <div class="mf"><button class="btn ghost" data-x>取消</button><button class="btn primary" id="mp-ok">核銷</button></div>`);
  $("#mp-ok",s).onclick=()=>{
    rec.bankPaid=true; rec.matchDate=$("#mp-date",s).value||today(); rec.matchTxnId=null;
    closeScrim(s);
    if(kind==="pay") INV_YEARS().forEach(pushPays); else INV_YEARS().forEach(pushMoves);
    toast("已核銷","ok");
  };
}
function unmarkPaid(arg){
  const [kind,id]=String(arg).split(":");
  const rec = kind==="pay" ? allPays().find(x=>x.id===id) : allMoves().find(x=>x.id===id);
  if(!rec) return;
  confirmModal("取消這筆的手動核銷？會回到「尚未對到銀行」。",()=>{
    rec.bankPaid=false; rec.matchDate=null;
    if(kind==="pay") INV_YEARS().forEach(pushPays); else INV_YEARS().forEach(pushMoves);
    toast("已取消核銷","ok");
  });
}

/* ---------------- inventory ---------------- */
function viewInv(){
  const y=S.ui.invYear;
  const st=stock();
  const stRows=Object.values(st).map(r=>`
    <tr><td><b>${esc(r.item.name)}</b>${r.item.unit?`<span class="hint"> / ${esc(r.item.unit)}</span>`:""}</td>
      <td class="num">${fmtP(r.in)}</td><td class="num">${fmtP(r.sold)}</td>
      <td class="num ${r.left<0?'badp':''}"><b>${fmtP(r.left)}</b></td>
      <td class="num">${fmt(r.salesAmt)}</td>
      <td class="right"><button class="btn sm ghost" data-edit-item="${r.item.id}">編輯</button></td></tr>`).join("");
  const moves=moveY(y).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const idset=new Set(moves.map(m=>m.id));
  [...invSel].forEach(id=>{ if(!idset.has(id)) invSel.delete(id); });
  const ins=moves.filter(m=>m.type!=="sale");
  const sales=moves.filter(m=>m.type==="sale");
  const tLbl={in:"進貨",transfer:"調入北屯"};

  /* 進：依日期收合 */
  const dgroups=[];
  ins.forEach(m=>{ const d=m.date||"（無日期）"; let g=dgroups.find(x=>x.date===d); if(!g){ g={date:d,list:[]}; dgroups.push(g); } g.list.push(m); });
  const inDetail=m=>`
    <tr class="detrow ${invSel.has(m.id)?'selrow':''}">
      <td><input type="checkbox" data-msel="${m.id}" ${invSel.has(m.id)?"checked":""}></td><td></td>
      <td>${esc(tLbl[m.type]||m.type)}</td>
      <td>${esc(itemName(m.itemId))}</td>
      <td class="num">${fmtP(m.qty)}</td>
      <td>${esc(m.by||"")}</td>
      <td class="hint">${esc(m.note||"")}</td>
      <td class="right nowrap"><button class="btn sm ghost" data-edit-move="${m.id}">編輯</button>
        <button class="btn sm danger" data-del-move="${m.id}">刪</button></td>
    </tr>`;
  const inRows=dgroups.map(g=>{
    const open=invOpen.has(g.date);
    const q=g.list.reduce((a,m)=>a+num(m.qty),0);
    const bys=[...new Set(g.list.map(m=>m.by).filter(Boolean))].join("、");
    const nSel=g.list.filter(m=>invSel.has(m.id)).length;
    return `<tr class="daterow" data-invdate="${esc(g.date)}" style="cursor:pointer">
        <td>${nSel?`<span class="chip acc">${nSel}</span>`:""}</td>
        <td class="nowrap"><b>${open?"▾":"▸"} ${esc(g.date)}</b><div class="hint">${g.list.length} 筆</div></td>
        <td class="hint">調入北屯</td>
        <td></td>
        <td class="num">${fmtP(q)}</td>
        <td class="hint">${esc(bys)}</td>
        <td></td>
        <td></td>
      </tr>${open?g.list.map(inDetail).join(""):""}`;
  }).join("");

  /* 銷：逐筆 */
  let tQty=0,tAmt=0;
  const saleRows=sales.map(m=>{
    const amt=num(m.price)*num(m.qty); tQty+=num(m.qty); tAmt+=amt;
    const rst = m.cash ? `<span class="chip mut">現金</span>`
      : (m.matchTxnId||m.bankPaid) ? `<span class="chip ok"><span class="dot"></span>已核對</span>`
      : `<span class="chip warn"><span class="dot"></span>待對帳</span>`;
    return `<tr class="${invSel.has(m.id)?'selrow':''}">
      <td><input type="checkbox" data-msel="${m.id}" ${invSel.has(m.id)?"checked":""}></td>
      <td class="nowrap">${esc(m.date||"")}</td>
      <td><b>${esc(itemName(m.itemId))}</b></td>
      <td class="num">${fmtP(m.qty)}</td>
      <td class="num">${fmtP(m.price)}</td>
      <td class="num"><b>${fmt(amt)}</b></td>
      <td>${esc(m.buyer||"")}</td>
      <td>${esc(m.by||"")}</td>
      <td class="hint">${m.cash?"現金":"匯款 "+esc(m.last5||"")}</td>
      <td>${rst}${isMgr()&&!m.cash&&!m.matchTxnId?(m.bankPaid?`<button class="btn sm ghost" data-unmark-paid="sale:${m.id}" style="margin-left:5px">取消</button>`:`<button class="btn sm primary" data-mark-paid="sale:${m.id}" style="margin-left:5px">✓ 核銷</button>`):""}</td>
      <td class="right nowrap"><button class="btn sm ghost" data-edit-move="${m.id}">編輯</button>
        <button class="btn sm danger" data-del-move="${m.id}">刪</button></td>
    </tr>`;
  }).join("");

  const inAllOn=ins.length>0 && ins.every(m=>invSel.has(m.id));
  const saleAllOn=sales.length>0 && sales.every(m=>invSel.has(m.id));
  const stAll=Object.values(st);
  const stLeft=stAll.reduce((a,r)=>a+r.left,0), stSales=stAll.reduce((a,r)=>a+r.salesAmt,0);
  const stLow=stAll.filter(r=>r.left<=0).length;
  return `
  <div class="panel">
    <div class="ph" data-toggle-stock style="cursor:pointer">
      <h3>${stockOpen?"▾":"▸"} 北屯裝備結存</h3>
      <span class="chip mut">${stAll.length} 品項 · 結存 ${fmtP(stLeft)} 件</span>
      ${stLow?`<span class="chip bad">${stLow} 項已無庫存</span>`:""}
      <div class="grow"></div>
      <button class="btn sm" data-act="add-item">＋ 品項</button>
      <button class="btn sm" data-act="export-stock">⬇ CSV</button></div>
    ${!S.invItems.length?`<div class="empty"><div class="big">▧</div>先新增裝備品項（例：冰刀、護具、隊服）。</div>`
    :stockOpen?`<div class="pb flush"><div class="tw"><table>
      <thead><tr><th>品項</th><th class="num">調入</th><th class="num">已售</th><th class="num">結存</th><th class="num">累計銷售額</th><th></th></tr></thead>
      <tbody>${stRows}</tbody>
      <tfoot class="tfoot"><tr><td>合計</td><td></td><td></td><td class="num">${fmtP(stLeft)}</td><td class="num">${fmt(stSales)}</td><td></td></tr></tfoot>
    </table></div></div>`:""}
  </div>

  <div class="panel">
    <div class="ph"><h3>${y} 年 進貨 / 調入北屯</h3><div class="grow"></div>
      ${invSel.size?`<button class="btn sm danger" data-act="del-moves-sel">🗑 刪除選取（${invSel.size}）</button>`:""}
      <button class="btn sm" data-act="import-inv">⬆ 批量匯入</button>
      <button class="btn primary sm" data-act="add-move-transfer">＋ 調入北屯</button></div>
    <div class="pb flush"><div class="tw"><table>
      <thead><tr><th style="width:34px"><input type="checkbox" id="msel-all-in" ${inAllOn?"checked":""}></th><th>日期</th><th>類型</th><th>品項</th><th class="num">數量</th><th>入庫人員</th><th>備註</th><th></th></tr></thead>
      <tbody>${inRows||`<tr><td colspan="8" class="empty">本年無進貨</td></tr>`}</tbody>
    </table></div></div>
  </div>

  <div class="panel">
    <div class="ph"><h3>${y} 年 銷售紀錄 <span class="hint">（${sales.length} 筆）</span></h3><div class="grow"></div>
      ${invSel.size?`<button class="btn sm danger" data-act="del-moves-sel">🗑 刪除選取（${invSel.size}）</button>`:""}
      <button class="btn sm" data-act="export-stock">⬇ CSV</button>
      <button class="btn primary sm" data-act="add-move-sale">＋ 銷售</button></div>
    <div class="pb flush"><div class="tw"><table>
      <thead><tr><th style="width:34px"><input type="checkbox" id="msel-all-sale" ${saleAllOn?"checked":""}></th><th>日期</th><th>品項</th><th class="num">數量</th><th class="num">單價</th><th class="num">金額</th><th>購買人</th><th>業務人員</th><th>付款</th><th>對帳</th><th></th></tr></thead>
      <tbody>${saleRows||`<tr><td colspan="11" class="empty">本年無銷售</td></tr>`}</tbody>
      ${sales.length?`<tfoot class="tfoot"><tr><td></td><td>合計</td><td></td><td class="num">${fmtP(tQty)}</td><td></td><td class="num">${fmt(tAmt)}</td><td colspan="5"></td></tr></tfoot>`:""}
    </table></div></div>
  </div>
  <p class="hint">結存 =（進貨＋調入北屯）−（銷售）。裝備「匯款」銷售會列入「裝備銷售對帳」的應收帳款。</p>`;
}
function itemModal(id){

  const editing=!!it; if(!it) it={id:uid(),name:"",unit:"",note:""};
  const s=scrim(`
   <div class="mh"><h3>${editing?"編輯品項":"新增品項"}</h3><button class="x" data-x>×</button></div>
   <div class="mb">
     <div class="field"><label>品項名稱</label><input class="txt" id="it-name" value="${esc(it.name)}" placeholder="例：冰刀 / 護具 / 隊服"></div>
     <div class="field"><label>單位（選填）</label><input class="txt" id="it-unit" value="${esc(it.unit||"")}" placeholder="雙 / 件 / 組"></div>

     <div class="grid2">
       <div class="field"><label>購買人</label><input class="txt" id="m-buyer" value="${esc(m.buyer||"")}"></div>
       <div class="field"><label>匯款後五碼</label><input class="txt" id="m-last5" value="${esc(m.last5||"")}" ${m.cash?"disabled":""}></div>
     </div>
     <div class="field"><label class="checkrow" style="margin:0"><input type="checkbox" id="m-cash" ${m.cash?"checked":""}> 現金（不進銀行對帳）</label></div>`:""}
     <div class="grid2">
       <div class="field"><label>備註</label><input class="txt" id="m-note" value="${esc(m.note||"")}"></div>

         <input class="txt" id="m-by" value="${esc(m.by||OP)}" placeholder="姓名">
         <div class="fh">預設帶入此裝置設定的姓名，可修改</div></div>
     </div>
   </div>
   <div class="mf">${editing?`<button class="btn danger ghost" id="m-del">刪除</button>`:""}
     <button class="btn ghost" data-x>取消</button><button class="btn primary" id="m-save">儲存</button></div>`);
  if(isSale) s.addEventListener("change",e=>{ if(e.target.id==="m-cash") $("#m-last5",s).disabled=e.target.checked; });
  $("#m-save",s).onclick=()=>{
   try{
    if(!$("#m-item",s).value){ toast("請先建立品項","bad"); return; }
    const rec={ id:m.id, type:kind, date:$("#m-date",s).value||today(), itemId:$("#m-item",s).value,
      qty:num($("#m-qty",s).value), note:$("#m-note",s).value.trim(),
      by: $("#m-by",s).value.trim() || (editing ? m.by : OP) || "",
      createdAt:m.createdAt||new Date().toISOString() };
    if(isSale){ rec.price=num($("#m-price",s).value); rec.cash=$("#m-cash",s).checked;
      rec.buyer=$("#m-buyer",s).value.trim(); rec.last5=rec.cash?"":norm5($("#m-last5",s).value);
      rec.matchTxnId=m.matchTxnId||null; rec.bankPaid=m.bankPaid||false; }
    Object.keys(S.invMoves).forEach(yy=>{ S.invMoves[yy]=S.invMoves[yy].filter(x=>x.id!==rec.id); });
    const yy=(rec.date||today()).slice(0,4);
    moveY(yy).push(rec);
    closeScrim(s); pushMoves(yy);
    toast("已儲存","ok");
   }catch(err){ toast("儲存失敗："+(err&&err.message||err),"bad"); console.error(err); }
  };
  if(editing) $("#m-del",s).onclick=()=>confirmModal("刪除這筆異動？",()=>{
    Object.keys(S.invMoves).forEach(yy=>{ S.invMoves[yy]=S.invMoves[yy].filter(x=>x.id!==m.id); });
    closeScrim(s); INV_YEARS().forEach(pushMoves); toast("已刪除","ok");
  });
}

/* ---------------- settings ---------------- */
function viewSettings(){
  const priceBlock=[1,2,3,4,5,6,0].map(wd=>{

/* ===================================================== import (xlsx / csv) */
function parseTable(text){
  text=text.replace(/\r/g,"");
  const lines=text.split("\n").filter(l=>l.trim()!=="");
  if(!lines.length) return {headers:[],rows:[]};
  const delim=lines[0].includes("\t")?"\t":(lines[0].split(",").length>=lines[0].split(";").length?",":";");
  const split=line=>{
    const out=[]; let cur="",q=false;
    for(let i=0;i<line.length;i++){ const c=line[i];
      if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else{ if(c==='"') q=true; else if(c===delim){ out.push(cur); cur=""; } else cur+=c; }
    }
    out.push(cur); return out.map(x=>x.trim());
  };
  return {headers:split(lines[0]),rows:lines.slice(1).map(split)};
}
function pick(headers,cands){
  for(let i=0;i<headers.length;i++){ const h=String(headers[i]).replace(/\s/g,"");
    if(cands.some(c=>h.includes(c))) return i; }
  return -1;
}
async function readXlsx(file){
  const buf=await file.arrayBuffer();
  const dv=new DataView(buf); const bytes=new Uint8Array(buf);
  let eo=-1;
  for(let i=bytes.length-22;i>=Math.max(0,bytes.length-22-65536);i--){ if(dv.getUint32(i,true)===0x06054b50){ eo=i; break; } }
  if(eo<0) throw new Error("非 xlsx");
  const cdCount=dv.getUint16(eo+10,true), cdOff=dv.getUint32(eo+16,true);
  const files={}; let p=cdOff;
  for(let i=0;i<cdCount;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), compSize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true), commLen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(bytes.subarray(p+46,p+46+nameLen));
    files[name]={method,compSize,lho}; p+=46+nameLen+extraLen+commLen;
  }
  async function extract(name){
    const f=files[name]; if(!f) return null;
    const lnameLen=dv.getUint16(f.lho+26,true), lextraLen=dv.getUint16(f.lho+28,true);
    const start=f.lho+30+lnameLen+lextraLen;
    const comp=bytes.subarray(start,start+f.compSize);
    if(f.method===0) return new TextDecoder().decode(comp);
    const ds=new DecompressionStream("deflate-raw");
    const ab=await new Response(new Blob([comp]).stream().pipeThrough(ds)).arrayBuffer();
    return new TextDecoder().decode(new Uint8Array(ab));
  }
  const wbXml=await extract("xl/workbook.xml");
  const relXml=await extract("xl/_rels/workbook.xml.rels");
  const ssXml=await extract("xl/sharedStrings.xml");
  const shared=[];
  if(ssXml){ new DOMParser().parseFromString(ssXml,"application/xml").querySelectorAll("si").forEach(si=>{
    let s=""; si.querySelectorAll("t").forEach(t=>s+=t.textContent); shared.push(s); }); }
  const relMap={};
  if(relXml){ new DOMParser().parseFromString(relXml,"application/xml").querySelectorAll("Relationship")
    .forEach(r=>relMap[r.getAttribute("Id")]=r.getAttribute("Target")); }
  const sheets=[];
  new DOMParser().parseFromString(wbXml,"application/xml").querySelectorAll("sheet").forEach(sh=>{
    const rid=sh.getAttribute("r:id")||sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    let tgt=relMap[rid]||""; if(tgt && !tgt.startsWith("xl/")) tgt="xl/"+tgt.replace(/^\//,"");
    sheets.push({name:sh.getAttribute("name"),target:tgt});
  });
  function colIdx(letters){ let n=0; for(const ch of letters) n=n*26+(ch.charCodeAt(0)-64); return n-1; }
  async function sheetGrid(target){
    const xml=await extract(target); if(!xml) return [];
    const doc=new DOMParser().parseFromString(xml,"application/xml"); const grid=[];
    doc.querySelectorAll("row").forEach(row=>{
      const cells=[];
      row.querySelectorAll("c").forEach(c=>{
        const ref=c.getAttribute("r")||""; const col=colIdx(ref.replace(/\d/g,""));
        const type=c.getAttribute("t"); const vEl=c.querySelector("v"); const isEl=c.querySelector("is");
        let val="";
        if(type==="s"&&vEl) val=shared[+vEl.textContent]||"";
        else if(type==="inlineStr"&&isEl) val=isEl.textContent;
        else if(vEl) val=vEl.textContent;
        cells[col]=val;
      });
      grid.push(cells);
    });
    return grid;
  }
  return {sheets,sheetGrid};
}

function buildImport(kind,table,opts){
  opts=opts||{};
  const H=table.headers;
  if(kind==="students"){
    let ni=pick(H,["學員名字","學員姓名","姓名","名字","學員","name"]); if(ni<0) ni=0;

      bd:pick(H,["學員生日","生日","出生"]), mob:pick(H,["手機號碼","手機","電話","聯絡"]),
      mail:pick(H,["gmail","gamil","email","信箱","電子"]), l5:pick(H,["後五碼","末五碼","後5碼","五碼"]),
      note:pick(H,["備註","note"]) };
    const g=(r,i)=>i>=0?String(r[i]||"").trim():"";
    const recs=table.rows.map(r=>({
      name:g(r,ni), parent:g(r,c.parent), parentPhone:normPhone(g(r,c.pphone)),
      birthday:normDate(g(r,c.bd)), mobile:normPhone(g(r,c.mob)), email:g(r,c.mail),
      last5:norm5(g(r,c.l5)), note:g(r,c.note)
    })).filter(x=>x.name && !["姓名","學員名字","學員姓名"].includes(x.name) && !/\t/.test(x.name) && !/^(基礎|進階|訓練營|成人)/.test(x.name));
    const byName=new Map(S.students.map(s=>[s.name,s]));
    let add=0,upd=0;
    recs.forEach(x=>{ if(byName.has(x.name)) upd++; else add++; });
    return {
      count:recs.length,
      html:`<p class="hint">找到 <b>${recs.length}</b> 筆有效資料：新增 ${add}、更新既有 ${upd}。</p>
        <div class="tw"><table><thead><tr><th>學員</th><th>家長</th><th>電話</th><th>生日</th><th>後五碼</th></tr></thead>
        <tbody>${recs.slice(0,20).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.parent)}</td><td>${esc(x.parentPhone||x.mobile)}</td><td>${esc(x.birthday)}</td><td>${esc(x.last5)}</td></tr>`).join("")}</tbody></table></div>`,
      commit:()=>{
        recs.forEach(x=>{
          const ex=byName.get(x.name);
          if(ex){ Object.assign(ex,{
            parent:x.parent||ex.parent, parentPhone:x.parentPhone||ex.parentPhone, birthday:x.birthday||ex.birthday,
            mobile:x.mobile||ex.mobile, email:x.email||ex.email, last5:x.last5||ex.last5, note:x.note||ex.note });
          } else S.students.push(Object.assign({id:uid(),active:true},x));
        });
        pushStudents(); toast(`已匯入：新增 ${add}、更新 ${upd}`,"ok");
      }
    };
  }
  if(kind==="inv"){
    const c={ item:pick(H,["品項","品名","裝備","商品","名稱","項目"]),
      qty:pick(H,["數量","件數","數","調入","調撥"]),
      date:pick(H,["日期","調撥日","入庫日"]), note:pick(H,["備註","note","說明"]) };
    let iCol=c.item>=0?c.item:0;
    let qCol=c.qty; if(qCol<0) qCol = iCol===0?1:0;   // 沒有「數量」標題時，取另一欄
    const g=(r,i)=>i>=0?String(r[i]||"").trim():"";
    const rawItems=[...S.invItems];
    const nameToItem=n=>{ let it=rawItems.find(x=>x.name===n); if(!it){ it={id:uid(),name:n,unit:"",note:""}; rawItems.push(it); } return it; };
    const recs=table.rows.map(r=>{
      const iname=g(r,iCol); const qty=num(g(r,qCol));
      if(!iname || iname==="品項" || !qty) return null;
      const it=nameToItem(iname);
      return { id:uid(), type:"transfer", date:normDate(g(r,c.date))||opts.date||today(),
        itemId:it.id, _iname:iname, qty, price:0, buyer:"", last5:"", cash:false,
        note:g(r,c.note), by:OP, createdAt:new Date().toISOString(), matchTxnId:null, bankPaid:false };
    }).filter(Boolean);
    const y=S.ui.invYear;
    const newItems=rawItems.filter(it=>!S.invItems.some(x=>x.id===it.id));
    const totQty=recs.reduce((a,x)=>a+x.qty,0);
    return {
      count:recs.length,
      html:`<p class="hint">共 <b>${recs.length}</b> 個品項、合計 <b>${fmtP(totQty)}</b> 件，將以「調入北屯」寫入 ${y} 年${newItems.length?`；自動新增品項：${newItems.map(i=>esc(i.name)).join("、")}`:""}。</p>
        <div class="tw"><table><thead><tr><th>日期</th><th>品項</th><th class="num">數量</th><th>備註</th></tr></thead>
        <tbody>${recs.slice(0,30).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x._iname)}</td><td class="num">${fmtP(x.qty)}</td><td class="hint">${esc(x.note||"")}</td></tr>`).join("")}</tbody></table></div>`,
      commit:()=>{
        if(newItems.length){ S.invItems.push(...newItems); pushItems(); }
        recs.forEach(x=>{ delete x._iname; moveY(y).push(x); });
        pushMoves(y); toast(`已匯入 ${recs.length} 筆調入北屯`,"ok");
      }
    };
  }
  // bank — 玉山格式
  const ci={ post:pick(H,["帳務日期"]), tdate:pick(H,["實際交易日期","交易日期"]), ttime:pick(H,["實際交易時間","交易時間"]),
    sum:pick(H,["摘要"]), cur:pick(H,["幣別"]), wd:pick(H,["提"]), dep:pick(H,["存"]), bal:pick(H,["餘額"]),
    memo:pick(H,["備註"]), acct:pick(H,["帳號","轉出入"]), seq:pick(H,["序號"]) };
  const items=table.rows.map(r=>{
    const acct=r[ci.acct]||"";
    return { id:uid(), seq:r[ci.seq]||"", postDate:r[ci.post]||"", txnDate:r[ci.tdate]||"", txnTime:r[ci.ttime]||"",
      summary:r[ci.sum]||"", currency:r[ci.cur]||"TWD", withdraw:num(r[ci.wd]), deposit:num(r[ci.dep]),
      balance:num(r[ci.bal]), memo:r[ci.memo]||"", account:acct, last5:last5of(acct), ignored:false };
  }).filter(x=>x.deposit>0||x.withdraw>0);
  const y=S.ui.bankYear;
  const keyOf=t=>[t.seq,t.postDate,t.txnDate,t.txnTime,t.withdraw,t.deposit,t.balance,t.account].join("|");
  const existing=new Set(bankY(y).map(keyOf));
  const fresh=items.filter(t=>!existing.has(keyOf(t)));
  const dep=fresh.filter(t=>t.deposit>0);
  return {
    count:fresh.length,
    html:`<p class="hint">共 ${items.length} 筆，新的 <b>${fresh.length}</b> 筆（入帳 ${dep.length} 筆）。重複自動略過。</p>
      <div class="tw"><table><thead><tr><th>日期</th><th class="num">存入</th><th>後五碼</th><th>摘要</th></tr></thead>
      <tbody>${dep.slice(0,12).map(t=>`<tr><td>${esc(t.txnDate||t.postDate)}</td><td class="num">${fmt(t.deposit)}</td><td>${esc(t.last5)}</td><td class="hint">${esc(t.summary)}</td></tr>`).join("")}</tbody></table></div>`,
    commit:()=>{ bankY(y).push(...fresh); pushBank(y); toast(`已匯入 ${fresh.length} 筆銀行明細`,"ok"); }
  };
}

/* ===================================================== CSV */
async function saveCSV(name,rows){
  const csv="﻿"+rows.map(r=>r.map(c=>{
    const s=String(c??""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(",")).join("\r\n");
  try{
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast("已匯出","ok"); return;
  }catch(e){ console.warn(e); }
  scrim(`<div class="mh"><h3>${esc(name)}</h3><button class="x" data-x>×</button></div>
    <div class="mb"><p class="hint">複製以下內容貼進 Excel／記事本另存：</p>
    <textarea class="txt" rows="12" style="width:100%">${esc(csv)}</textarea></div>
    <div class="mf"><button class="btn primary" data-x>關閉</button></div>`,"wide");
}
function exportDues(all){
  const ym=S.ui.ym; const roster=monthRoster(ym);
  const rows=[[`${ymLabel(ym)} 應收對帳`],[],["學員","堂數","原價","折扣","應收","已收(登錄)","銀行核對","未收"]];
  let tS=0,tG=0,tDs=0,tD=0,tL=0,tB=0,n=0;
  roster.forEach(s=>{
    const d=studentDue(ym,s.id),p=studentPaid(ym,s.id);
    if(!all && d.amount-p.logged<=TOL) return;
    rows.push([s.name,d.sessions,d.gross,d.discount?-d.discount:"",d.amount,p.logged,p.bank,d.amount-p.logged]);
    tS+=d.sessions; tG+=d.gross; tDs+=d.discount; tD+=d.amount; tL+=p.logged; tB+=p.bank; n++;
  });
  rows.push([`合計（${n} 位）`,tS,tG,tDs?-tDs:"",tD,tL,tB,tD-tL]);
  saveCSV(`${all?"應收對帳":"催繳"}_${ym}.csv`,rows);
}
function exportStock(){
  const st=stock();
  const y=S.ui.invYear;
  const rows=[["北屯裝備結存"],[],["品項","單位","調入","已售","結存","累計銷售額"]];
  Object.values(st).forEach(r=>rows.push([r.item.name,r.item.unit||"",r.in,r.sold,r.left,r.salesAmt]));
  const ms=moveY(y).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const tLbl={in:"進貨",transfer:"調入北屯"};
  rows.push([],[`${y} 年 進貨／調入北屯`],["日期","類型","品項","數量","入庫人員","備註"]);
  ms.filter(m=>m.type!=="sale").forEach(m=>rows.push([m.date,tLbl[m.type]||m.type,itemName(m.itemId),m.qty,m.by||"",m.note||""]));
  rows.push([],[`${y} 年 銷售紀錄`],["日期","品項","數量","單價","金額","購買人","業務人員","付款","對帳"]);
  let tq=0,ta=0;
  ms.filter(m=>m.type==="sale").forEach(m=>{
    const a=num(m.price)*num(m.qty); tq+=num(m.qty); ta+=a;
    rows.push([m.date,itemName(m.itemId),m.qty,m.price,a,m.buyer||"",m.by||"",m.cash?"現金":"匯款 "+(m.last5||""),m.cash?"—":(m.matchTxnId||m.bankPaid)?"已核對":"待對帳"]);
  });
  rows.push(["","合計","",tq,ta]);
  saveCSV(`裝備進銷存_${y}.csv`,rows);
}
function exportAttend(){
  const ym=S.ui.ym;
  const dates=activeDates(ym);
  const roster=monthRoster(ym);
  const head=["學員",...dates.map(dt=>`${(+dt.slice(-2))}(${"日一二三四五六"[wdOf(dt)]})`),"堂數","應收"];
  const rows=[[`${ymLabel(ym)} 點名表`],[],head];
  roster.forEach(s=>{
    const line=[s.name];
    dates.forEach(dt=>{
      line.push(cellEntries(ym,s.id,dt).slice().sort((a,b)=>a.slot-b.slot).map(e=>entryLabel(dt,e)).join(" / "));
    });
    const d=studentDue(ym,s.id);
    line.push(d.sessions,d.amount);
    rows.push(line);
  });
  // 各上課日出席人次
  const foot=["出席人次"];
  dates.forEach(dt=>{ let n=0; roster.forEach(s=>n+=cellEntries(ym,s.id,dt).length); foot.push(n); });
  const totSess=roster.reduce((a,s)=>a+studentDue(ym,s.id).sessions,0);
  const totDue=roster.reduce((a,s)=>a+studentDue(ym,s.id).amount,0);
  foot.push(totSess,totDue);
  rows.push([],foot);
  saveCSV(`點名表_${ym}.csv`,rows);
}
function exportAttDue(){
  const ym=S.ui.ym, roster=monthRoster(ym);
  const enrolled=enrolledStudents(ym,roster);
  const rows=[[`${ymLabel(ym)} 課程應收（依點名 × 價目表）`],[]];
  const sessTot={}; let gS=0,gGross=0,gDisc=0;
  enrolled.forEach(s=>{ const b=studentDueBreakdown(ym,s.id), d=studentDue(ym,s.id); gS+=b.sessions; gGross+=d.gross; gDisc+=d.discount;
    Object.entries(b.byLabel).forEach(([l,v])=>{ const t=(sessTot[l]=sessTot[l]||{count:0,amount:0}); t.count+=v.count; t.amount+=v.amount; }); });
  rows.push(["== 各場次（原價）=="],["場次","全月總堂數","原價金額"]);
  Object.entries(sessTot).sort((a,b)=>b[1].amount-a[1].amount).forEach(([l,v])=>rows.push([l,v.count,v.amount]));
  rows.push(["原價合計",gS,gGross],[]);
  rows.push(["== 各學員報名情況 =="],["學員","場次明細","堂數","原價","折扣","應收"]);
  enrolled.forEach(s=>{ const b=studentDueBreakdown(ym,s.id), d=studentDue(ym,s.id);
    rows.push([s.name,Object.entries(b.byLabel).map(([l,v])=>`${l}×${v.count}`).join("、"),b.sessions,d.gross,d.discount?-d.discount:"",d.amount]); });
  rows.push([`合計（${enrolled.length} 位）`,"",gS,gGross,gDisc?-gDisc:"",gGross-gDisc]);
  saveCSV(`課程應收_${ym}.csv`,rows);
}
