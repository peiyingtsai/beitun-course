  const pw=e.target.closest("[data-pnlweek]"); if(pw && !e.target.closest("button")){ const k=pw.dataset.pnlweek; pnlWeekOpen.has(k)?pnlWeekOpen.delete(k):pnlWeekOpen.add(k); rerender(); return; }
  const av=e.target.closest("[data-attview]"); if(av){ S.ui.attView=av.dataset.attview; saveLS(); rerender(); return; }
  const ad=e.target.closest("[data-attdate]"); if(ad){ S.ui.attDate=ad.dataset.attdate; saveLS(); rerender(); return; }

  const t=e.target.closest("[data-act],[data-edit-student],[data-del-student],[data-edit-pay],[data-del-pay],[data-edit-item],[data-edit-move],[data-del-move],[data-assign],[data-bankpay],[data-mark-paid],[data-unmark-paid],[data-ignore],[data-del-cls]");
  if(!t) return;
  const d=t.dataset;
  if(d.act==="add-student") studentEditModal();
  else if(d.act==="import-students") importModal("students");
  else if(d.act==="edit-dates") editDatesModal();
  else if(d.act==="add-pay") payModal();
  else if(d.act==="add-item") itemModal();
  else if(d.act==="add-move-transfer") moveModal("transfer");
  else if(d.act==="add-move-sale") moveModal("sale");
  else if(d.act==="import-bank") importModal("bank");
  else if(d.act==="import-inv") importModal("inv");
  else if(d.act==="auto-match") runAutoMatch(S.ui.bankYear, d.side||"pay");
  else if(d.act==="export-dues") exportDues(true);
  else if(d.act==="export-owe") exportDues(false);
  else if(d.act==="export-attend") exportAttend();
  else if(d.act==="export-attdue") exportAttDue();
  else if(d.act==="save-cost"){ pushCost(S.ui.ym); toast("已儲存成本","ok"); }
  else if(d.act==="export-stock") exportStock();
  else if(d.act==="clear-bank"){ const y=S.ui.bankYear;
    confirmModal(`清空 ${y} 年銀行明細？已對帳的收款仍保留「已核對」狀態（bankPaid），只失去差額提示。`,()=>{
      bankY(y).forEach(()=>{});
      // 蓋章
      const R=reconcile(y);
      R.recInfo.forEach(x=>{ if(x.st==="paid"||x.st==="paid-diff"){ x.rec.ref.bankPaid=true; x.rec.ref.matchTxnId=null; } });
      S.bank[y]=[];
      INV_YEARS().forEach(yy=>{ pushPays(yy); pushMoves(yy); }); pushBank(y);
      toast("已清空銀行明細","ok");
    }); }
  else if(d.editStudent) studentEditModal(d.editStudent);
  else if(d.delStudent){ const s=S.students.find(x=>x.id===d.delStudent);
    confirmModal(`刪除學員「${s?.name}」？`,()=>{ S.students=S.students.filter(x=>x.id!==d.delStudent); pushStudents(); toast("已刪除","ok"); }); }
  else if(d.editPay) payModal(d.editPay);
  else if(d.delPay){ confirmModal("刪除這筆收款？",()=>{
      Object.keys(S.pays).forEach(y=>{ S.pays[y]=S.pays[y].filter(x=>x.id!==d.delPay); });
      INV_YEARS().forEach(pushPays); toast("已刪除","ok"); }); }
  else if(d.editItem) itemModal(d.editItem);
  else if(d.editMove) moveModal(d.editMove);
  else if(d.delMove){ confirmModal("刪除這筆異動？",()=>{
      Object.keys(S.invMoves).forEach(y=>{ S.invMoves[y]=S.invMoves[y].filter(x=>x.id!==d.delMove); });
      invSel.delete(d.delMove); INV_YEARS().forEach(pushMoves); toast("已刪除","ok"); }); }
  else if(d.act==="del-moves-sel"){ const ids=[...invSel]; if(!ids.length) return;
      confirmModal(`刪除選取的 ${ids.length} 筆異動紀錄？此動作無法復原。`,()=>{
        const set=new Set(ids);
        Object.keys(S.invMoves).forEach(y=>{ S.invMoves[y]=S.invMoves[y].filter(x=>!set.has(x.id)); });
        invSel.clear(); INV_YEARS().forEach(pushMoves); toast(`已刪除 ${ids.length} 筆`,"ok");
      }); }
  else if(d.assign) assignModal(d.assign);
  else if(d.bankpay) bankPayModal(d.bankpay);
  else if(d.markPaid) markPaidModal(d.markPaid);
  else if(d.unmarkPaid) unmarkPaid(d.unmarkPaid);
  else if(d.ignore){ const y=S.ui.bankYear; const tx=bankY(y).find(x=>x.id===d.ignore);
    if(tx){ tx.ignored=!tx.ignored; pushBank(y); } }
  else if(d.delCls){ S.settings.classes=S.settings.classes.filter(c=>c.id!==d.delCls); pushSettings(); }
});

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.sf){ const {wd,i,sf}=t.dataset; const o=S.settings.price[wd][+i]; if(o){ o[sf]= sf==="price"?num(t.value):t.value; } }
  if(t.dataset.cd){ if(!S.settings.consecDiscount) S.settings.consecDiscount={price:1200,weeks:4,amount:300}; S.settings.consecDiscount[t.dataset.cd]=num(t.value); }
  if(t.dataset.cf){ const c=S.settings.classes.find(x=>x.id===t.dataset.id); if(c) c[t.dataset.cf]=t.value; }
  if(t.dataset.cost){
    const [monday,cat,field]=t.dataset.cost.split("|");
    const wk=costM(S.ui.ym).weeks;
    if(!wk[monday]) wk[monday]={};
    if(!wk[monday][cat]) wk[monday][cat]={};
    wk[monday][cat][field]= field==="amount"?num(t.value):t.value;
  }
  if(t.dataset.costm){
    const [cat,field]=t.dataset.costm.split("|");
    const mo=costM(S.ui.ym).monthly;
    if(!mo[cat]) mo[cat]={};
    mo[cat][field]= field==="amount"?num(t.value):t.value;
  }
});
